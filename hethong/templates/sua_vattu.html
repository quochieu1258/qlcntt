{% extends 'base.html' %}

{% block title %}Cập Nhật Vật Tư CNTT{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cleave.js@1.6.0/dist/cleave.min.js"></script>

<div class="max-w-4xl mx-auto mt-6">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">
            <i class="fas fa-edit text-blue-600 mr-2"></i> Cập Nhật Thông Tin Vật Tư
        </h2>
        
        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Mã vật tư</label>
                    <input class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" 
                           type="text" name="ma_vat_tu" value="{{ vt.ma_vat_tu|default:'' }}">
                </div>
                
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tên vật tư *</label>
                    <input class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" 
                           type="text" name="ten_vat_tu" value="{{ vt.ten_vat_tu }}" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nơi để vật tư</label>
                    <input class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" 
                           type="text" name="noi_de_vat_tu" value="{{ vt.noi_de_vat_tu|default:'' }}" placeholder="VD: Tủ A1, Kho tầng 2...">
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Hạn sử dụng</label>
                    <input class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500" 
                           type="text" id="han_su_dung" name="han_su_dung" value="{{ vt.han_su_dung|date:'Y-m-d' }}">
                </div>
                
                <div class="md:col-span-2 mt-2 bg-orange-50 p-4 rounded-lg border border-orange-100">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="is_tieu_hao" class="form-checkbox h-5 w-5 text-orange-600 rounded focus:ring-orange-500 border-gray-300 transition duration-150 ease-in-out" {% if vt.is_tieu_hao %}checked{% endif %}>
                        <span class="ml-2 text-sm font-bold text-gray-700">Đây là vật tư tiêu hao <span class="text-orange-600 font-normal italic">(Sử dụng 1 lần, không thu hồi)</span></span>
                    </label>
                </div>
            </div>
            
            <div class="flex items-center space-x-4 border-t pt-6">
                <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow-md transition" type="submit">
                    Lưu Thay Đổi
                </button>
                <a href="{% url 'danh_sach_vat_tu' %}" class="text-gray-500 hover:text-gray-800 font-medium">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        flatpickr("#han_su_dung", {
            dateFormat: "Y-m-d", altInput: true, altFormat: "d/m/Y", locale: "vn", allowInput: true,
            onReady: function(d, s, i) {
                new Cleave(i.altInput, { date: true, delimiter: '/', datePattern: ['d', 'm', 'Y'] });
            }
        });
    });
</script>
{% endblock %}
