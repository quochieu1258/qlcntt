{% extends 'base.html' %}

{% block title %}Cập Nhật Khoa Phòng{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Cập Nhật Thông Tin Khoa Phòng</h2>

        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-bold mb-2">Mã khoa phòng</label>
                <!-- Dùng thuộc tính value để đổ dữ liệu cũ ra ô input -->
                <input class="shadow-sm appearance-none border border-gray-300 rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       type="text" name="ma_khoa_phong" value="{{ kp.ma_khoa_phong|default_if_none:'' }}">
            </div>
            
            <div class="mb-8">
                <label class="block text-gray-700 text-sm font-bold mb-2">Tên khoa phòng <span class="text-red-500">*</span></label>
                <input class="shadow-sm appearance-none border border-gray-300 rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       type="text" name="ten_khoa_phong" value="{{ kp.ten_khoa_phong }}" required>
            </div>
            
            <div class="flex items-center space-x-4">
                <button class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-6 rounded transition duration-200" type="submit">
                    <i class="fas fa-save mr-2"></i> Cập nhật
                </button>
                <a href="{% url 'them_khoa_phong' %}" class="text-gray-500 hover:text-gray-800 font-medium">
                    Hủy bỏ & Quay lại
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
