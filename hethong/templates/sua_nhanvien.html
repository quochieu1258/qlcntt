{% extends 'base.html' %}
{% block title %}Sửa Nhân Viên{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-md border-t-4 border-indigo-500">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4"><i class="fas fa-user-edit text-indigo-500 mr-2"></i> Sửa Thông Tin Nhân Viên</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">Mã Nhân Viên</label>
            <input type="text" name="ma_nhan_vien" value="{{ nv.ma_nhan_vien|default:'' }}" class="w-full border rounded-lg px-4 py-2">
        </div>
        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">Tên Nhân Viên <span class="text-red-500">*</span></label>
            <input type="text" name="ten_nhan_vien" value="{{ nv.ten_nhan_vien }}" required class="w-full border rounded-lg px-4 py-2">
        </div>
        
        <div class="flex justify-end space-x-3">
            <a href="{% url 'them_nhan_vien' %}" class="bg-gray-200 hover:bg-gray-300 font-bold py-2 px-6 rounded-lg text-gray-800 transition">Hủy</a>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-8 rounded-lg shadow-md transition"><i class="fas fa-save mr-2"></i> Cập Nhật</button>
        </div>
    </form>
</div>
{% endblock %}
