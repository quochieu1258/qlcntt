{% extends 'base.html' %}
{% block title %}Sửa Nội Dung Hư Hỏng{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>

<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-md border-t-4 border-red-500">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4"><i class="fas fa-edit text-red-600 mr-2"></i> Cập Nhật Lý Do Hư Hỏng</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">Tên thiết bị</label>
            <input type="text" value="{{ tb.ten_thiet_bi }}" readonly class="w-full border rounded px-3 py-2 bg-gray-100 font-bold text-gray-500 cursor-not-allowed">
        </div>
        
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">Ngày xác nhận hỏng</label>
            <input type="text" id="ngay_hoan_tat" name="ngay_hoan_tat" value="{{ lich_su.ngay_hoan_tat|date:'Y-m-d' }}" required class="w-full border rounded px-3 py-2 focus:ring-red-500 focus:border-red-500 bg-white">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-1">Ghi chú tình trạng hỏng</label>
            <textarea name="ghi_chu_hoan_tat" rows="4" required class="w-full border rounded px-3 py-2 focus:ring-red-500 focus:border-red-500">{{ lich_su.ghi_chu_hoan_tat }}</textarea>
        </div>
        
        <div class="flex justify-end space-x-3 border-t pt-5">
            <a href="{% url 'bao_cao_thiet_bi_hong' %}" class="bg-gray-200 hover:bg-gray-300 font-bold py-2 px-6 rounded-lg text-gray-800 transition">Hủy</a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-8 rounded-lg shadow-md transition flex items-center">
                <i class="fas fa-save mr-2"></i> Lưu Cập Nhật
            </button>
        </div>
    </form>
</div>

<script>
    flatpickr("#ngay_hoan_tat", { dateFormat: "Y-m-d", altInput: true, altFormat: "d/m/Y", locale: "vn" });
</script>
{% endblock %}
